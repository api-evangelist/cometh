deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation policy is published. A migration guide exists for the SDK generation change (Connect legacy -> Connect
    4337) and it instructs licence holders to contact Cometh to be moved onto the 4337 licensing model, but a migration
    guide is not a policy, so no `Deprecation` pointer is wired into apis.yml.
  migration_guide: https://docs.cometh.io/resources/migrate-from-the-connect-legacy-sdk
sla:
  url: null
  uptime_target: null
  note: No SLA or uptime commitment is published; the status page shows historical uptime but promises nothing.
