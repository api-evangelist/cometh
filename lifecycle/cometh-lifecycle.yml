note: >-
  Cometh runs a real public status page and a real SDK migration path, but publishes no versioning policy, no deprecation
  policy, no Sunset/Deprecation header support and no SLA — a full-text search of the documentation returns zero matches
  for "deprecat" and "sunset". The most consequential lifecycle facts about this provider are not stated in its own
  docs: the Marketplace and Checkout APIs have been withdrawn (their SDKs are still on npm, their hosts no longer route),
  and the company was acquired by Kaiko. Both are recorded here with the evidence they were established from.
