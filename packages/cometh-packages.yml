note: >-
  Cometh publishes its client libraries under the npm @cometh scope for web/TypeScript, and distributes the mobile SDKs
  from git tags (Swift Package Manager for iOS, JitPack for Android) rather than from CocoaPods or Maven Central —
  probes of trunk.cocoapods.org (swift4337, Cometh) and search.maven.org (g:io.cometh) both returned zero results, and
  pypi.org/pypi/cometh/json returned 404. The current, maintained line is @cometh/connect-sdk-4337 (published
  2026-04-28); the 1.x @cometh/connect-sdk "legacy" line has not been republished since 2024-09-03 and the docs carry a
  migration guide off it. @cometh/marketplace-sdk and @cometh/checkout-sdk wrap the Marketplace and Checkout APIs,
  whose hosts (api.marketplace.cometh.io, api.checkout.cometh.io) now answer only a Kong "no Route matched with those
  values" 404 behind a default self-signed certificate — those SDKs are recorded as stale, not current.
