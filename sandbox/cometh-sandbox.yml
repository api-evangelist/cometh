- name: dashboard tutorial download
  note: >-
    The dashboard's "getting started" button downloads the tutorial repository pre-wired to the project's apiKey; the
    docs show the flow but the artefact is behind the dashboard login.
test_clocks:
  supported: false
  note: >-
    No time simulation. The one time-dependent flow — social recovery — has a real 24-hour challenge window that must
    elapse before /recovery/finalize succeeds, with no documented way to fast-forward it in testing.
console:
  url: https://app.cometh.io
  note: >-
    Project dashboard: create a project per network, read the project apiKey and apiSecret, register sponsored contract
    addresses for the paymaster, and download the tutorial. Login-gated; access to a first Connect account is
    human-gated via the contact link.
local_development:
  note: >-
    Passkeys require a secure context, so local development must run on https or localhost, and a passkey created on
    localhost is not usable from a deployed domain (passkeys are bound to origin). Documented in the FAQ as a testing
    constraint.
  source: https://docs.cometh.io/resources/faq
