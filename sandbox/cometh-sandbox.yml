generated: '2026-08-17'
method: searched
source: https://docs.cometh.io/quick-start/getting-started
docs:
- https://docs.cometh.io/quick-start/getting-started
- https://docs.cometh.io/quick-start/supported-networks
note: >-
  Cometh has no "sandbox mode" in the Stripe sense — there are no test-mode key prefixes, no magic test values and no
  simulator. The test surface is the public EVM TESTNETS: a project in the dashboard is created against one network, so
  a testnet project's apikey is by construction a test credential, and the getting-started tutorial is written against
  Polygon testnet / Arbitrum Sepolia. Everything recorded below is published verbatim in the docs; nothing is invented.
  Note that the testnet path is not fully self-serve: first-time users are told to "reach out so we can set you up with
  a Connect account and apiKey".
mode_separation:
  style: per-project-per-network
  key_prefixes: []
  test_key_prefix: null
  live_key_prefix: null
  note: >-
    One apikey per project, one project per chain. There is no documented prefix or flag distinguishing a testnet key
    from a mainnet key — the chain id in the endpoint path (bundler.cometh.io/{chainId}) is what selects test vs live.
  dashboard: https://app.cometh.io
  signup: https://app.cometh.io/register?product=connect
test_networks:
