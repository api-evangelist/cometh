aid: cometh
name: Cometh
description: >-
  Cometh is a French DeFi infrastructure provider building regulated, API-first crypto financial services for European
  fintechs, asset managers and corporates — custody, staking and yield, digital-asset trading, and payment settlement —
  on a composable ERC-4337 / Safe smart-account stack inside a MiCA-aligned regulatory perimeter (registered DASP;
  CASP licence AMF No. A2025-008; ISO 27001:2022). The publicly documented and callable surface today is Cometh
  Connect, a white-label ERC-4337 smart-wallet SDK with passkey (WebAuthn) signers, ERC-7579 session keys, social
  recovery and gasless transactions, served by an ERC-4337 Bundler JSON-RPC, a Paymaster JSON-RPC with sponsorship
  REST routes, and the Connect backend API. Every endpoint is gated at a Kong gateway by a project apikey (query
  string, front end) or apisecret (header, back end) issued from the app.cometh.io dashboard. The broader
  "DeFi-as-a-Service" API layer is sales-gated and its documentation is marked coming soon. Cometh was acquired by
  crypto market-data provider Kaiko, announced December 2025.
