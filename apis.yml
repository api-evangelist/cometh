apis:
- name: Cometh Connect Bundler API
  description: >-
    ERC-4337 bundler JSON-RPC endpoint. Accepts User Operations into the mempool, estimates UserOp gas, returns a
    UserOp and its receipt by hash, and lists supported EntryPoint addresses. One endpoint per EVM chain, addressed by
    chain id in the path, authenticated with a project apikey in the query string.
  humanURL: https://docs.cometh.io/bundler/bundler-api
  baseURL: https://bundler.cometh.io/{chainId}
  tags:
  - erc-4337
  - bundler
  - account-abstraction
  - json-rpc
  - Blockchain
  tags_raw:
  - erc-4337
  - bundler
  - account-abstraction
  - json-rpc
  - blockchain
  properties:
  - type: Documentation
    url: https://docs.cometh.io/bundler/bundler-api
  - type: APIReference
    url: https://docs.cometh.io/bundler/bundler-api
  - type: Authentication
    url: authentication/cometh-authentication.yml
  - type: Conventions
    url: conventions/cometh-conventions.yml
- name: Cometh Connect Paymaster API
  description: >-
    ERC-4337 paymaster JSON-RPC endpoint for transaction sponsorship (pm_sponsorUserOperation, pm_supportedEntryPoints)
    plus REST routes to read and register the sponsored contract addresses and sponsored chains of a project. Chain id
    in the path; reads use a project apikey in the query string, writes use an apisecret from the back end.
  humanURL: https://docs.cometh.io/paymaster/paymaster-api
  baseURL: https://paymaster.cometh.io/{chainId}
  tags:
  - erc-4337
  - paymaster
  - gasless-transactions
  - json-rpc
  - Blockchain
