  - type: APIReference
    url: https://docs.cometh.io/paymaster/paymaster-api
  - type: Authentication
    url: authentication/cometh-authentication.yml
- name: Cometh Connect API
  description: >-
    Connect backend API used by the Connect 4337 SDK for wallet lifecycle and recovery — wallet init and import,
    WebAuthn signer creation and address prediction, project parameters, relayed transaction status, and the social
    recovery flow (start, start-with-shared, finalize). Recovery routes are apisecret-protected and documented as
    server-to-server calls.
  humanURL: https://docs.cometh.io/advanced/social-recovery
  baseURL: https://api.4337.cometh.io
